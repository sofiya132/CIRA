AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CIRA serverless incident response infrastructure

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional email address for SNS notifications

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Resources:

  # --------------------------------------------------
  # HTTP API (single entry point for the frontend)
  # --------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # --------------------------------------------------
  # DynamoDB
  # --------------------------------------------------
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sentinelx-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH

  IncidentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sentinelx-incidents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH

  IncidentTimelineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cira-incident-timeline
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # --------------------------------------------------
  # SNS Topics
  # --------------------------------------------------

  CampusCriticalAlerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cira-critical-alerts

  CampusEscalations:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cira-escalations

  # --------------------------------------------------
  # SNS Email Subscription
  # --------------------------------------------------

  CriticalAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref CampusCriticalAlerts
      Protocol: email
      Endpoint: !Ref NotificationEmail

  EscalationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref CampusEscalations
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # --------------------------------------------------
  # Reports Lambda  (POST /reports -> ingest, fuse/create, prioritize)
  # --------------------------------------------------

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/reports/handler.handler
      Environment:
        Variables:
          REPORTS_TABLE_NAME: !Ref ReportsTable
          INCIDENTS_TABLE_NAME: !Ref IncidentTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
      Events:
        PostReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reports
            Method: post

  # --------------------------------------------------
  # Incidents Lambda  (GET/PATCH /incidents)
  # --------------------------------------------------

  IncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/incidents/handler.handler
      Environment:
        Variables:
          INCIDENTS_TABLE_NAME: !Ref IncidentTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable
      Events:
        GetIncidents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents
            Method: get
        GetIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{incident_id}
            Method: get
        PatchIncident:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /incidents/{incident_id}
            Method: patch

  # --------------------------------------------------
  # AI Extraction Lambda  (POST /reports/extract -> Bedrock)
  # Commented out for now: nothing in the frontend calls this route yet,
  # and it needs Bedrock model access enabled. Uncomment once someone
  # wires the frontend to call /reports/extract and Bedrock access is on.
  # --------------------------------------------------

  # AiExtractionFunction:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     CodeUri: ../backend/
  #     Handler: lambda/ai_extraction/handler.handler
  #     Timeout: 30
  #     Environment:
  #       Variables:
  #         AI_PROVIDER: bedrock
  #         BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
  #     Policies:
  #       - Statement:
  #           - Effect: Allow
  #             Action:
  #               - bedrock:InvokeModel
  #             Resource: "*"
  #     Events:
  #       PostExtract:
  #         Type: HttpApi
  #         Properties:
  #           ApiId: !Ref HttpApi
  #           Path: /reports/extract
  #           Method: post

  # --------------------------------------------------
  # Routing Lambda
  # --------------------------------------------------

  RoutingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/routing/handler.handler

  # --------------------------------------------------
  # Timeline Lambda
  # --------------------------------------------------

  TimelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/timeline/handler.handler
      Environment:
        Variables:
          TIMELINE_TABLE_NAME: !Ref IncidentTimelineTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref IncidentTimelineTable

  # --------------------------------------------------
  # Notification Lambda
  # --------------------------------------------------

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/notifications/handler.handler
      Environment:
        Variables:
          CRITICAL_TOPIC_ARN: !Ref CampusCriticalAlerts
          ESCALATION_TOPIC_ARN: !Ref CampusEscalations
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CampusCriticalAlerts.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CampusEscalations.TopicName

  # --------------------------------------------------
  # Acknowledgement Lambda
  # --------------------------------------------------

  AcknowledgementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/acknowledgement/handler.handler

  # --------------------------------------------------
  # Workflow Status Lambda
  # --------------------------------------------------

  WorkflowStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/incidents/workflow_status.handler
      Environment:
        Variables:
          INCIDENTS_TABLE_NAME: !Ref IncidentTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentTable

  # --------------------------------------------------
  # Step Functions
  # --------------------------------------------------

  IncidentEscalationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: CIRA-Incident-Escalation
      DefinitionUri: ../workflows/escalation/state-machine.json

      DefinitionSubstitutions:
        ROUTING_LAMBDA_ARN: !GetAtt RoutingFunction.Arn
        TIMELINE_LAMBDA_ARN: !GetAtt TimelineFunction.Arn
        SNS_NOTIFY_LAMBDA_ARN: !GetAtt NotificationFunction.Arn
        CHECK_ACK_LAMBDA_ARN: !GetAtt AcknowledgementFunction.Arn
        WORKFLOW_STATUS_LAMBDA_ARN: !GetAtt WorkflowStatusFunction.Arn

      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RoutingFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TimelineFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NotificationFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AcknowledgementFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkflowStatusFunction

Conditions:
  HasNotificationEmail: !Not
    - !Equals
      - !Ref NotificationEmail
      - ""

Outputs:

  ApiUrl:
    Description: Base URL for the HTTP API (frontend VITE_API_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  ReportsTableName:
    Description: DynamoDB reports table
    Value: !Ref ReportsTable

  IncidentsTableName:
    Description: DynamoDB incidents table
    Value: !Ref IncidentTable

  TimelineTableName:
    Description: DynamoDB incident timeline table
    Value: !Ref IncidentTimelineTable

  CriticalAlertsTopicArn:
    Description: SNS critical alerts topic
    Value: !Ref CampusCriticalAlerts

  EscalationsTopicArn:
    Description: SNS escalation topic
    Value: !Ref CampusEscalations

  StateMachineArn:
    Description: CIRA Step Functions state machine
    Value: !Ref IncidentEscalationStateMachine