<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CIRA architecture on AWS</title>
<desc>A browser talks to an S3-hosted frontend and to an API Gateway HTTP API, which invokes AWS Lambda functions running the fusion and priority engines, which read and write Amazon DynamoDB. Lambda also triggers AWS Step Functions and Amazon SNS for escalation alerts.</desc>

<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="310" y1="96" x2="310" y2="156" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="310" y1="212" x2="310" y2="272" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="310" y1="328" x2="310" y2="388" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="310" y1="444" x2="310" y2="504" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="440" y1="416" x2="460" y2="416" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Browser -->
<rect x="180" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="310" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Browser</text>
<text x="310" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">React + TypeScript frontend</text>

<!-- S3 -->
<rect x="180" y="156" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Amazon S3</text>
<text x="310" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Static site hosting</text>

<!-- API Gateway -->
<rect x="180" y="272" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="310" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">API Gateway</text>
<text x="310" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">HTTP API entry point</text>

<!-- Lambda -->
<rect x="180" y="388" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="310" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">AWS Lambda</text>
<text x="310" y="426" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Fusion and priority engines</text>

<!-- DynamoDB -->
<rect x="180" y="504" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="310" y="522" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Amazon DynamoDB</text>
<text x="310" y="542" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Reports and incidents tables</text>

<!-- Step Functions + SNS -->
<rect x="460" y="388" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Step Functions</text>
<text x="550" y="426" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Escalation via SNS</text>

</svg>
